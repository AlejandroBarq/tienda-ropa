<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prendas de Vestir</title>
  <style>
    table {
      width: 90%;
      margin: 2rem auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.75rem;
      text-align: left;
    }
    th {
      background-color: #004466;
      color: white;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Listar todas las Prendas</h1>

  <table id="tabla-prendas">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Marca</th>
        <th>Categoría</th>
        <th>Talla</th>
        <th>Precio</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const url = "http://127.0.0.1:5000/tienda-ropa/api/v1/prendas/";

    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        const tbody = document.querySelector("#tabla-prendas tbody");
        tbody.innerHTML = ""; // Limpia la tabla

        data.forEach(prenda => {
          const tr = document.createElement("tr");
          
          // Extraemos los campos exactos del JSON de Postman
          const nombre = prenda.nombre || "N/A";
          const marca = prenda.marca ? prenda.marca.nombre : "N/A";
          const categoria = prenda.categoria || "N/A";
          const talla = prenda.talla || "N/A";
          const precio = prenda.precio !== undefined ? prenda.precio : 0;
          const stock = prenda.stock !== undefined ? prenda.stock : 0;

          tr.innerHTML = `
            <td>${nombre}</td>
            <td>${marca}</td>
            <td>${categoria}</td>
            <td>${talla}</td>
            <td>$${precio}</td>
            <td>${stock}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => {
        console.error("Error cargando prendas:", err);
      });
  </script>
</body>
</html>
